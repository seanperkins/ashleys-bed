<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 575" width="600" height="575" role="img" font-family="system-ui, sans-serif"><title>Step 22: Place the bookcase beside the bed and restrain it to the wall</title><rect width="100%" height="100%" fill="#fff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker></defs><text x="16.0" y="28.0" font-size="13" font-weight="normal" fill="#9aa5b1" text-anchor="start">Step 22 of 22</text><text x="16.0" y="50.0" font-size="17" font-weight="bold" fill="#1f2933" text-anchor="start">Place the bookcase beside the bed and restrain it to the</text><text x="16.0" y="67.0" font-size="17" font-weight="bold" fill="#1f2933" text-anchor="start">wall</text><rect x="8" y="84" width="584" height="153" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><text x="20.0" y="104.0" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="start">HOLD — not ready to build</text><text x="20.0" y="124.0" font-size="13" font-weight="normal" fill="#7f1d1d" text-anchor="start">Wall restraint for the bookcase not chosen (hardware and position).</text><text x="20.0" y="141.0" font-size="13" font-weight="normal" fill="#7f1d1d" text-anchor="start">Drawer-slide model not chosen. It sets the slide screw pattern, the drawer-box</text><text x="20.0" y="158.0" font-size="13" font-weight="normal" fill="#7f1d1d" text-anchor="start">clearance and the space under the fixed shelf L07.</text><text x="20.0" y="175.0" font-size="13" font-weight="normal" fill="#7f1d1d" text-anchor="start">Screw-tip clearance: proposed #8 x 1-1/8 in screws for the stop M07; JJ screws</text><text x="20.0" y="192.0" font-size="13" font-weight="normal" fill="#7f1d1d" text-anchor="start">checked against the bracket thickness. Owner to confirm.</text><text x="20.0" y="209.0" font-size="13" font-weight="normal" fill="#7f1d1d" text-anchor="start">Rockler's 5/8 in blind holes leave about 0.08 in in 0.703 in stock; the guide</text><text x="20.0" y="226.0" font-size="13" font-weight="normal" fill="#7f1d1d" text-anchor="start">proposes 1/2 in. Owner to confirm.</text><g class="part done" data-part="L11"><polygon points="320.9,436.6 319.4,437.5 361.2,461.6 362.7,460.8" fill="#eef1f4" stroke="#9aa5b1" stroke-width="1" stroke-linejoin="round"/><polygon points="362.7,488.3 361.2,489.2 361.2,461.6 362.7,460.8" fill="#eef1f4" stroke="#9aa5b1" stroke-width="1" stroke-linejoin="round"/><polygon points="319.4,465.1 361.2,489.2 361.2,461.6 319.4,437.5" fill="#eef1f4" stroke="#9aa5b1" stroke-width="1" stroke-linejoin="round"/></g><g class="part done" data-part="L13"><polygon points="319.4,437.5 240.3,483.2 241.8,484.0 320.9,438.3" fill="#eef1f4" stroke="#9aa5b1" stroke-width="1" stroke-linejoin="round"/><polygon points="320.9,465.9 241.8,511.6 241.8,484.0 320.9,438.3" fill="#eef1f4" stroke="#9aa5b1" stroke-width="1" stroke-linejoin="round"/><polygon points="240.3,510.8 241.8,511.6 241.8,484.0 240.3,483.2" fill="#eef1f4" stroke="#9aa5b1" stroke-width="1" stroke-linejoin="round"/></g><g class="part done" data-part="L04"><polygon points="318.7,463.8 233.6,512.9 281.3,540.5 366.4,491.4" fill="#eef1f4" stroke="#9aa5b1" stroke-width="1" stroke-linejoin="round"/><polygon points="366.4,493.9 281.3,543.1 281.3,540.5 366.4,491.4" fill="#eef1f4" stroke="#9aa5b1" stroke-width="1" stroke-linejoin="round"/><polygon points="233.6,515.5 281.3,543.1 281.3,540.5 233.6,512.9" fill="#eef1f4" stroke="#9aa5b1" stroke-width="1" stroke-linejoin="round"/></g><g class="part done" data-part="L15"><polygon points="320.9,464.2 238.8,511.6 280.6,535.8 362.7,488.3" fill="#eef1f4" stroke="#9aa5b1" stroke-width="1" stroke-linejoin="round"/><polygon points="362.7,489.2 280.6,536.6 280.6,535.8 362.7,488.3" fill="#eef1f4" stroke="#9aa5b1" stroke-width="1" stroke-linejoin="round"/><polygon points="238.8,512.5 280.6,536.6 280.6,535.8 238.8,511.6" fill="#eef1f4" stroke="#9aa5b1" str
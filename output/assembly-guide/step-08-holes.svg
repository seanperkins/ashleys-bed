<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 310" width="600" height="310" role="img" font-family="system-ui, sans-serif"><title>Holes: Fix the headboards to the studs with six lag bolts KK</title><rect width="100%" height="100%" fill="#fff"/><text x="16.0" y="28.0" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Holes — Fix the headboards to the studs with six lag bolts KK</text><text x="16.0" y="50.0" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="start">M05 — on each stud line</text><text x="50.0" y="74.0" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="start">On each stud line:</text><text x="50.0" y="94.0" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start">3" down from the top edge of M05 — Ø3/16 through (lag bolt)</text><text x="50.0" y="118.0" font-size="12" font-weight="normal" fill="#1d4ed8" text-anchor="start">Find the stud centres with a stud finder; at least three studs.</text><text x="50.0" y="138.0" font-size="12" font-weight="normal" fill="#9aa5b1" text-anchor="start">Transcribed from Rockler p. 11.</text><text x="16.0" y="180.0" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="start">M06 — on each stud line</text><text x="50.0" y="204.0" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="start">On each stud line:</text><text x="50.0" y="224.0" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start">3" up from the bottom edge of M06 — Ø3/16 through (lag bolt)</text><text x="50.0" y="248.0" font-size="12" font-weight="normal" fill="#1d4ed8" text-anchor="start">Find the stud centres with a stud finder; at least three studs.</text><text x="50.0" y="268.0" font-size="12" font-weight="normal" fill="#9aa5b1" text-anchor="start">Transcribed from Rockler p. 11.</text></svg>
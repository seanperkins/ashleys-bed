<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 252" width="600" height="252" role="img" font-family="system-ui, sans-serif"><title>Holes: Fit the three wall brackets HH on top of the cabinet</title><rect width="100%" height="100%" fill="#fff"/><text x="16.0" y="28.0" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Holes — Fit the three wall brackets HH on top of the cabinet</text><text x="16.0" y="50.0" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="start">M03 — on each stud line</text><text x="50.0" y="74.0" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="start">On each stud line:</text><text x="50.0" y="94.0" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start">A1  4 5/8" from the wall — Ø13/64 × 1/2 deep (bracket's steel dowel)</text><text x="50.0" y="112.0" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start">A2  4" from the wall — Ø5/16 through (bolt)</text><text x="50.0" y="130.0" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start">A3  2 3/4" from the wall — Ø1/8 × 1/2 deep (screw pilot)</text><text x="50.0" y="148.0" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start">A4  1 1/2" from the wall — Ø1/8 × 1/2 deep (screw pilot)</text><text x="50.0" y="166.0" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start">A5, A6: mark through the bracket onto the wall, 3/16 in pilots into the stud.</text><text x="50.0" y="190.0" font-size="12" font-weight="normal" fill="#1d4ed8" text-anchor="start">Find the stud centres with a stud finder; at least three studs.</text><text x="50.0" y="210.0" font-size="12" font-weight="normal" fill="#9aa5b1" text-anchor="start">Transcribed from Rockler p. 12.</text></svg>
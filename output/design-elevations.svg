<text x="70" y="1253.2" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="29" fill="#182B49">Left bookcase: four open bays above one drawer; three adjustable shelves.</text>
<text x="70" y="1301.6" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#182B49">Carcass dimensions exclude projecting pulls. Steel hardware and folding motion remain representative.</text>
<text x="70" y="1351.6" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#182B49">NOT A MACHINING RELEASE: finalize stock thickness, joinery, shelf fit, slide model, cutters and workholding.</text>
<text x="70" y="1400.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="25" fill="#182B49">Native Fusion wood-body bounds; follow Rockler anchoring instructions. Hidden wall brackets remain required.</text>
